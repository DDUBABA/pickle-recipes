name: Release and build index
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release-main
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile all merged PRs and assign versions
        run: node scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUBMISSION_METADATA_SECRET: ${{ secrets.SUBMISSION_METADATA_SECRET }}
      - run: node scripts/validate.mjs
      - run: python scripts/check_python.py
      - run: node scripts/build.mjs
      - run: node --test tests/*.test.mjs
      - name: Commit generated releases, catalog and sitemap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recipes sitemap.xml robots.txt .github/release-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish item versions and catalog'
            git push origin HEAD:main
          fi
      - name: Publish the verified production branch for Pages Git integration
        run: git push origin HEAD:production
      - name: Detect Cloudflare deployment configuration
        id: cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Verified production branch published. Direct CLI deployment skipped; Pages Git integration can deploy production.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install locked Wrangler
        if: steps.cloudflare.outputs.ready == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply D1 migrations and deploy finalized build
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 migrations apply DB --remote
          pnpm exec wrangler pages deploy dist --project-name pickle-recipes --branch main
