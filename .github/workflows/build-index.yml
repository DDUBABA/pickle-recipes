name: Release and build index
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release-main
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
jobs:
  release:
    # Generated commit identity remains stable across account/App renames.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.committer.email != '41898282+github-actions[bot]@users.noreply.github.com' ||
      !startsWith(github.event.head_commit.message, 'chore: publish item versions and catalog')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Issue a repository-scoped release bot token
        id: release-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: pickle-recipes
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconcile all merged PRs and assign versions
        run: node scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          SUBMISSION_METADATA_SECRET: ${{ secrets.SUBMISSION_METADATA_SECRET }}
      - run: node scripts/validate.mjs
      - run: python scripts/check_python.py
      - run: node scripts/build.mjs
      - run: node --test tests/*.test.mjs
      - name: Commit generated releases, catalog and sitemap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recipes bridge/index.json bridge/hosts.json hosts.json sitemap.xml robots.txt .github/release-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish item versions and catalog'
            git push origin HEAD:main
          fi
      - name: Detect Cloudflare deployment configuration
        id: cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Verified production branch published. Direct CLI deployment skipped; Pages Git integration can deploy production.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install locked Wrangler
        if: steps.cloudflare.outputs.ready == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply D1 migrations before triggering Pages Git deployment
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --remote
      - name: Publish the verified production branch for Pages Git integration
        run: git push origin HEAD:production
      - name: Deploy finalized build directly
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler pages deploy dist --project-name pickle-recipes --branch production
