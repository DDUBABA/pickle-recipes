name: Release and sync catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  # Checkout latest main after acquiring this lock: superseded queued runs are safe.
  group: release-main
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.committer.email != '41898282+github-actions[bot]@users.noreply.github.com' ||
      !startsWith(github.event.head_commit.message, 'chore: publish item versions and catalog')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare synchronization credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
      - name: Issue a repository-scoped release bot token
        id: release-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: pickle-recipes
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compare code with the last deployed production branch
        id: scope
        run: node scripts/deployment-scope.mjs origin/production
      - name: Reconcile merged PRs and generate reviewed indexes only
        run: node scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          SUBMISSION_METADATA_SECRET: ${{ secrets.SUBMISSION_METADATA_SECRET }}
      - run: node scripts/validate.mjs
      - run: python scripts/check_python.py
      - name: Build and test changed site code
        if: steps.scope.outputs.deploy == 'true'
        run: |
          node scripts/build.mjs
          node --test tests/*.test.mjs
      - name: Install locked Wrangler for site changes only
        if: steps.scope.outputs.deploy == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply schema and disable automatic Git deployments
        if: steps.scope.outputs.deploy == 'true'
        run: |
          node node_modules/wrangler/bin/wrangler.js d1 migrations apply DB --remote
          node scripts/configure-pages.mjs
      - name: Commit reviewed releases and generated indexes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recipes bridge/index.json bridge/hosts.json hosts.json sitemap.xml robots.txt .github/release-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish item versions and catalog'
            git push origin HEAD:main
          fi
      - name: Atomically sync changed data and indexes to D1
        run: node scripts/sync-catalog.mjs
      - name: Deploy site code once
        if: steps.scope.outputs.deploy == 'true'
        run: node node_modules/wrangler/bin/wrangler.js pages deploy dist --project-name pickle-recipes --branch production
      - name: Record the successfully deployed code revision
        if: steps.scope.outputs.deploy == 'true'
        run: git push origin HEAD:production
      - name: Report data-only publication
        if: steps.scope.outputs.deploy != 'true'
        run: echo 'Reviewed data synchronized to D1. No site build or Pages deployment was run.' >> "$GITHUB_STEP_SUMMARY"
