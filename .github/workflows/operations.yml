name: Production health and retention
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-operations
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify production and apply retention
        run: node scripts/operations.mjs --maintenance
        env:
          SUBMISSION_METADATA_SECRET: ${{ secrets.SUBMISSION_METADATA_SECRET }}
      - name: Explain incident
        if: failure()
        run: echo 'Production security/availability or retention failed. Inspect the failed step, Cloudflare deployment and D1. Do not weaken access controls to restore service.' >> "$GITHUB_STEP_SUMMARY"
