name: PR validation
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  application-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: node scripts/build.mjs
      - run: node --test tests/*.test.mjs
      - run: python scripts/check_python.py
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: proposed
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate schema, README, privacy and dangerous code
        run: node trusted/scripts/validate.mjs proposed
      - name: Compile Python without running submitted code
        run: python trusted/scripts/check_python.py proposed
      - name: Check PR scope and latest base version
        run: node trusted/scripts/check-pr.mjs proposed
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check summary
        if: always()
        run: |
          echo '## Pickle Recipes validation' >> "$GITHUB_STEP_SUMMARY"
          echo 'Schema, privacy, dangerous-code scan, Python syntax and version checks are shown in the steps above. Submitted Python was not executed.' >> "$GITHUB_STEP_SUMMARY"
